<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版本比对</title><link rel="stylesheet" href="/style.css"></head>
<body><header><h1>文档版本比对</h1><button id="newDocument" title="新建文档">+</button></header><main><aside><div class="heading"><h2>文档</h2><button id="refresh" title="刷新">&#8635;</button></div><div id="documents"></div></aside><section id="workspace"><div class="empty">选择文档，或创建第一份文档。</div></section></main><dialog id="editor"><form method="dialog"><h2 id="dialogTitle">新建文档</h2><label>标题<input id="title" required maxlength="120"></label><label>摘要<input id="summary" maxlength="300"></label><label>正文<textarea id="content" required rows="14" placeholder="以空行分隔段落"></textarea></label><label id="messageWrap">提交说明<input id="message"></label><menu><button value="cancel">取消</button><button id="save" value="default">保存</button></menu></form></dialog><script src="/app.js"></script></body></html>
